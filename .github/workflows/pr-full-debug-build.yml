name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:
  # Fork: build the embedded-chapters branch on every push.
  push:
    branches: [claude/nuviotv-embedded-chapters-m6gefy]

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
          TRAKT_API_URL: ${{ secrets.TRAKT_API_URL }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          PARENTAL_GUIDE_API_URL: ${{ secrets.PARENTAL_GUIDE_API_URL }}
          TRAILER_API_URL: ${{ secrets.TRAILER_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          TV_LOGIN_WEB_BASE_URL: ${{ secrets.TV_LOGIN_WEB_BASE_URL }}
          DEVICE_LOGIN_WEB_BASE_URL: ${{ secrets.DEVICE_LOGIN_WEB_BASE_URL }}
          AVATAR_PUBLIC_BASE_URL: ${{ secrets.AVATAR_PUBLIC_BASE_URL }}
          UNIQUE_CONTRIBUTIONS_BASE_URL: ${{ secrets.UNIQUE_CONTRIBUTIONS_BASE_URL }}
          PLAYBACK_REPORTS_BASE_URL: ${{ secrets.PLAYBACK_REPORTS_BASE_URL }}
          SUPPORTERS_API_BASE_URL: ${{ secrets.SUPPORTERS_API_BASE_URL }}
          SUPPORT_URL: ${{ secrets.SUPPORT_URL }}
          SPONSOR_NAMES: ${{ secrets.SPONSOR_NAMES }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

          # Fork: repository secrets named like a build property (see fork-config-keys.txt).
          # Debug builds read some keys only from local.dev.properties, so write both files.
          python3 .github/scripts/apply-fork-secrets.py .github/scripts/fork-config-keys.txt \
            local.properties local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Test updater and build fullDebug APK
        run: ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.updater.*' --tests 'com.nuvio.tv.core.player.chapters.*' --tests 'com.nuvio.tv.ui.screens.player.PlayerNextEpisodeRulesTest' :app:assembleFullDebug --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
